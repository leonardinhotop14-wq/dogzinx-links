    <script>
        // 🔒 SENHA DO DONO
        const OWNER_PASSWORD = '12345678';
        
        let links = [];
        let linksDocs = [];
        let isOwner = false;

        // Elementos
        const secretBtn = document.getElementById('secretBtn');
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const adminPanel = document.getElementById('adminPanel');
        const linksContainer = document.getElementById('linksContainer');
        const adminLinksList = document.getElementById('adminLinksList');
        const extraLinksLabel = document.getElementById('extraLinksLabel');

        // Abrir modal de senha
        secretBtn.addEventListener('click', () => {
            passwordModal.style.display = 'flex';
            passwordInput.value = '';
            passwordInput.focus();
        });

        function closeModal() {
            passwordModal.style.display = 'none';
            passwordInput.value = '';
        }

        function checkPassword() {
            if (passwordInput.value === OWNER_PASSWORD) {
                isOwner = true;
                passwordModal.style.display = 'none';
                adminPanel.style.display = 'block';
                renderLinks();
            } else {
                alert('❌ Senha incorreta!');
            }
        }

        function logout() {
            isOwner = false;
            adminPanel.style.display = 'none';
        }

        async function loadLinks() {
            try {
                if (!window.db) return;
                const snapshot = await getDocs(window.colRef);
                linksDocs = snapshot.docs;
                links = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLinks();
            } catch(e) {
                console.log('Erro ao carregar:', e);
            }
        }

            linksContainer.innerHTML = '';
            adminLinksList.innerHTML = '';
            extraLinksLabel.style.display = links.length === 0 ? 'none' : 'block';

                linkCard.className = 'link-card';
                linkCard.innerHTML = `

                        ${link.image ? `<img src="${link
